name: Tests

on: [push, pull_request]

env:
  CHANNEL: 'stable'

jobs:
  native:
    name: Native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: bash tests/native/run.sh

  engine:
    name: Engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - name: Download bob.jar
        run: |
          sha=$(curl -sf https://d.defold.com/${{ env.CHANNEL }}/info.json | jq -r '.sha1')
          echo "Defold version $sha"
          curl -sfL -o "$RUNNER_TEMP/bob.jar" https://d.defold.com/archive/${{ env.CHANNEL }}/$sha/bob/bob.jar
      - name: Build and run
        run: BOB="$RUNNER_TEMP/bob.jar" bash tests/api/run.sh
